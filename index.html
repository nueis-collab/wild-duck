<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<style>
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#1a0d05;display:flex;align-items:center;justify-content:center;overflow:hidden;}
#wrap{display:flex;justify-content:center;align-items:center;width:100%;height:100%;}
#gBox{position:relative;width:680px;height:306px;overflow:visible;border:3px solid #DAA520;border-radius:6px;flex-shrink:0;transform-origin:center center;}
canvas#gc{position:absolute;top:0;left:0;width:680px;height:306px;}
.scr{position:absolute;top:0;left:0;width:680px;height:306px;display:none;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;}
#nmS,#nmCfS{overflow:visible!important;}
.scr.on{display:flex;}
#sS{background:linear-gradient(180deg,#0d0500 0%,#3d1f0a 38%,#8B4513 65%,#C87420 82%,#DEB887 100%);}
#mS{background:linear-gradient(180deg,#0d0500 0%,#3d1f0a 40%,#8B4513 68%,#C87420 83%,#DEB887 100%);}
#eS{background:rgba(0,0,0,0.9);}
#cS{background:linear-gradient(180deg,#0d0500 0%,#2a1208 60%,#4a2010 100%);overflow-y:auto;}
button{pointer-events:all;cursor:pointer;border:2px solid #DAA520;background:rgba(100,50,10,0.85);color:#FFD700;font-family:Georgia,serif;font-size:14px;font-weight:bold;padding:8px 22px;border-radius:6px;margin:5px;letter-spacing:1px;transition:all 0.12s;}
button:hover{background:rgba(160,90,30,0.95);transform:scale(1.04);}
button:active{transform:scale(0.97);}
.gbtn{background:linear-gradient(135deg,#7a5a10,#C8960A);color:#1a0800;border-color:#FFD700;}
.ttl{color:#FFD700;font-size:42px;font-weight:bold;text-shadow:2px 2px 0 #8B4513,4px 4px 0 #000;letter-spacing:3px;font-family:Georgia,serif;}
.sub{color:#DEB887;font-size:15px;letter-spacing:5px;margin-bottom:18px;font-family:Georgia,serif;}
#fb{position:absolute;top:25%;left:50%;transform:translate(-50%,-50%) scale(0);font-size:40px;font-weight:bold;color:#FFD700;text-shadow:0 0 14px #FF6600,2px 2px 0 #000;pointer-events:none;transition:transform 0.22s;z-index:50;white-space:nowrap;font-family:Georgia,serif;}
#fb.on{transform:translate(-50%,-50%) scale(1.15);}
#rlBar{position:absolute;bottom:92px;left:50%;transform:translateX(-50%);pointer-events:none;opacity:0;transition:opacity 0.25s;}
#rlBar.on{opacity:1;}
#nmInput::placeholder{color:rgba(255,215,0,0.3);}
#nmInput:focus{border-color:#FFD700;box-shadow:0 0 8px rgba(255,215,0,0.4);}
</style>
<div id="wrap"><div id="gBox">
<canvas id="gc"></canvas>
<div id="sS" class="scr">
  <div style="display:flex;align-items:center;gap:20px;">
    <div style="position:relative;display:flex;align-items:center;justify-content:center;">
      <canvas id="heroC" width="180" height="260"></canvas>
      <canvas id="badgeC" width="130" height="130" style="position:absolute;top:-18px;right:-22px;display:none;"></canvas>
    </div>
    <div style="text-align:right;">
      <div class="ttl">황야의 오리</div>
      <div class="sub">WILD DUCK</div>
      <button class="gbtn" onclick="showM()" style="font-size:17px;padding:11px 30px;display:block;">▶ 게임 시작</button>
      <button onclick="showC()" style="font-size:13px;margin-top:3px;">🏆 도전과제</button>
      <button onclick="showRank()" style="font-size:13px;margin-top:0px;">🏅 랭킹</button>
      <button onclick="showHow(0)" style="font-size:13px;margin-top:0px;">❓ 플레이방법</button>
    </div>
  </div>
</div>
<div id="mS" class="scr">
  <div class="ttl" style="font-size:28px;margin-bottom:8px;">모드 선택</div>
  <div style="display:flex;gap:22px;margin-top:8px;">
    <div style="text-align:center;border:2px solid #DAA520;border-radius:10px;padding:16px 20px;background:rgba(0,0,0,0.5);">
      <div style="font-size:28px;margin-bottom:5px;">🤠</div>
      <div style="color:#FFD700;font-size:16px;font-weight:bold;margin-bottom:4px;font-family:Georgia,serif;">사냥꾼 모드</div>
      <div style="color:#DEB887;font-size:12px;margin-bottom:10px;font-family:Georgia,serif;">느린 표적 · 이지</div>
      <button onclick="startG('hunter')">사냥꾼 모드</button>
    </div>
    <div style="text-align:center;border:2px solid #FFD700;border-radius:10px;padding:16px 20px;background:rgba(120,60,10,0.4);">
      <div style="font-size:28px;margin-bottom:5px;">⭐</div>
      <div style="color:#FFD700;font-size:16px;font-weight:bold;margin-bottom:4px;font-family:Georgia,serif;">보안관 모드</div>
      <div style="color:#DEB887;font-size:12px;margin-bottom:10px;font-family:Georgia,serif;">빠른 표적 · AI 즉반응</div>
      <button class="gbtn" onclick="startG('sheriff')">보안관 모드</button>
    </div>
  </div>
  <button onclick="showScr('sS')" style="margin-top:10px;font-size:13px;">← 뒤로</button>
</div>
<div id="gS" class="scr" style="pointer-events:none;">
  <div id="fb">🔥 FEVER TIME! 🔥</div>
  <div id="rlBar"><canvas id="rlC" width="100" height="26"></canvas></div>
</div>
<div id="eS" class="scr">
  <div class="ttl" style="font-size:30px;margin-bottom:10px;">🏆 게임 종료</div>
  <canvas id="rankC" width="420" height="210" style="border:2px solid #DAA520;border-radius:8px;margin-bottom:12px;"></canvas>
  <div style="display:flex;gap:10px;">
    <button onclick="startG(window.gMode)">🔄 다시 시작</button>
    <button onclick="showScr('sS')">🏠 시작 화면</button>
  </div>
</div>
<div id="cS" class="scr">
  <div style="display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:6px;position:relative;">
    <button onclick="showScr('sS')" style="position:absolute;left:10px;font-size:12px;padding:5px 13px;margin:0;">← 뒤로</button>
    <div class="ttl" style="font-size:24px;">🏆 도전과제</div>
  </div>
  <canvas id="chalC" width="520" height="330" style="border:2px solid #DAA520;border-radius:8px;margin-bottom:4px;"></canvas>
  <div style="color:#DEB887;font-size:10px;text-align:center;font-family:Georgia,serif;">각 그룹의 도전과제를 모두 달성하면 보상이 해금됩니다</div>
</div>
<div id="rkS" class="scr" style="background:linear-gradient(180deg,#0d0500 0%,#2a1208 60%,#4a2010 100%);">
  <div style="display:flex;align-items:center;justify-content:center;width:100%;margin-bottom:6px;position:relative;">
    <button onclick="showScr('sS')" style="position:absolute;left:10px;font-size:12px;padding:5px 13px;margin:0;">← 뒤로</button>
    <div class="ttl" style="font-size:22px;">🏅 랭킹</div>
  </div>
  <div style="display:flex;gap:8px;margin-bottom:6px;">
    <button id="rkTabH" onclick="showRankTab('hunter')" style="font-size:12px;padding:5px 16px;">🤠 사냥꾼</button>
    <button id="rkTabS" onclick="showRankTab('sheriff')" style="font-size:12px;padding:5px 16px;">⭐ 보안관</button>
  </div>
  <canvas id="rkC" width="500" height="230" style="border:2px solid #DAA520;border-radius:8px;"></canvas>
</div>
<div id="hwS" class="scr" style="background:linear-gradient(180deg,#0d0500 0%,#3d1f0a 50%,#5a2a0a 100%);">
  <canvas id="hwC" width="680" height="306" style="position:absolute;top:0;left:0;"></canvas>
  <div id="hwOverlay" style="position:absolute;bottom:10px;display:flex;flex-direction:column;align-items:center;gap:6px;">
    <div id="hwTxt" style="background:rgba(0,0,0,0.75);border:2px solid #DAA520;border-radius:8px;padding:8px 18px;color:#FFD700;font-family:Georgia,serif;font-size:14px;font-weight:bold;text-align:center;max-width:500px;"></div>
    <div style="display:flex;gap:8px;">
      <button id="hwPrev" onclick="hwNav(-1)" style="font-size:12px;padding:5px 14px;">◀ 이전</button>
      <div id="hwDots" style="display:flex;align-items:center;gap:5px;"></div>
      <button id="hwNext" onclick="hwNav(1)" style="font-size:12px;padding:5px 14px;">다음 ▶</button>
    </div>
  </div>
</div>
<div id="nmS" class="scr" style="background:linear-gradient(180deg,#0d0500 0%,#3d1f0a 38%,#8B4513 65%,#C87420 82%,#DEB887 100%);overflow:visible;z-index:10;">
  <canvas id="nmDuckC" width="110" height="130" style="margin-bottom:4px;"></canvas>
  <div style="color:#FFD700;font-size:18px;font-weight:bold;font-family:Georgia,serif;text-shadow:1px 1px 0 #000;margin-bottom:10px;">당신의 코드네임은?</div>
  <input id="nmInput" type="text" maxlength="6" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
    style="font-family:Georgia,serif;font-size:20px;font-weight:bold;color:#FFD700;background:rgba(0,0,0,0.7);border:2px solid #DAA520;border-radius:8px;padding:8px 14px;width:190px;text-align:center;outline:none;letter-spacing:3px;position:relative;z-index:11;"
    placeholder="1~6자 입력"
    oninput="nmCheck()"
  />
  <div id="nmWarn" style="color:#FF6600;font-size:11px;font-family:Georgia,serif;height:16px;margin-top:4px;"></div>
  <button id="nmOkBtn" class="gbtn" onclick="nmConfirmPrompt()" style="font-size:15px;padding:9px 28px;margin-top:6px;opacity:0.45;cursor:not-allowed;" disabled>완료</button>
</div>
<div id="nmCfS" class="scr" style="background:rgba(0,0,0,0.88);">
  <div style="border:2px solid #DAA520;border-radius:12px;background:linear-gradient(180deg,#1a0d05,#3a1a08);padding:24px 32px;display:flex;flex-direction:column;align-items:center;gap:12px;max-width:340px;">
    <div style="color:#FFD700;font-size:20px;font-weight:bold;font-family:Georgia,serif;">확정하시겠습니까?</div>
    <div style="color:#DEB887;font-size:14px;font-family:Georgia,serif;">코드네임 : <span id="nmConfirmName" style="color:#FFD700;font-size:18px;font-weight:bold;letter-spacing:2px;"></span></div>
    <div style="display:flex;gap:10px;margin-top:4px;">
      <button class="gbtn" onclick="nmFinish()" style="font-size:14px;padding:9px 22px;">🎮 게임 시작!</button>
      <button onclick="nmGoBack()" style="font-size:13px;padding:9px 18px;">🤔 아직 고민중</button>
    </div>
  </div>
</div>
</div></div>

<script>
const GW=680,GH=306;
const gc=document.getElementById('gc');
const ctx=gc.getContext('2d');
gc.width=GW; gc.height=GH;

const CHAL_DEF={
  hunter_win:{l:'사냥꾼 모드 승리'},
  hunter_5k:{l:'사냥꾼 8000점 이상'},
  hunter_8k:{l:'사냥꾼 10000점 이상'},
  sheriff_win:{l:'보안관 모드 승리'},
  sheriff_8k:{l:'보안관 8000점 이상'},
  hunter_noempty:{l:'탄창 비운 적 없이 사냥꾼 승리'},
  sheriff_noempty:{l:'탄창 비운 적 없이 보안관 8000점 승리'},
};
let cd={};
try{cd=JSON.parse(localStorage.getItem('wdcd3')||'{}');}catch(e){}
let gRev=false,gDuck=false,gHat=false;
function chkRew(){
  gRev=['hunter_win','hunter_5k','hunter_8k'].every(k=>cd[k]);
  gDuck=['sheriff_win','sheriff_8k'].every(k=>cd[k]);
  gHat=['hunter_noempty','sheriff_noempty'].every(k=>cd[k]);
}
chkRew();

let playerName='나';
try{const _n=localStorage.getItem('wdpname');if(_n&&_n.length>=1&&_n.length<=6)playerName=_n;}catch(e){}
const PL=[
  {name:playerName,bc:'#F0F0F0',wc:'#e0e0e0',sc:'#b8b8b8',isP:true},
  {name:'핑크',bc:'#FFB6C1',wc:'#ff9aaa',sc:'#d06070',isP:false},
  {name:'파랑',bc:'#87CEEB',wc:'#5ab0d8',sc:'#3080b0',isP:false},
  {name:'노랑',bc:'#FFE566',wc:'#e8c830',sc:'#c09010',isP:false},
];
const BM=10;
let bul,scores,gMode,gAct,fever,tgts,tCnt,nextWave,batchN,animID;
let reloading=false, reloadPct=0, reloadStart=0;
let bulletEmptied=false;
let totalBulUsed=[0,0,0,0];
let bulAtStart=[BM,BM,BM,BM];

const TTYPES=[
  {t:'cactus',c:'#3DB84A',lc:'#1a7a28',pts:100,sz:76,ic:'🌵'},
  {t:'fox',   c:'#E8C020',lc:'#a08010',pts:200,sz:60,ic:'🦊'},
  {t:'eagle', c:'#3A80EE',lc:'#1050b0',pts:300,sz:48,ic:'🦅'},
  {t:'duck',  c:'#9B30CC',lc:'#5a1090',pts:500,sz:40,ic:'🦆'},
];

function showScr(id){
  document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  if(id==='sS'){drawHero();drawBadge();}
  if(id==='cS')drawChal();
  if(id==='rkS')drawRankScreen();
  if(id==='hwS'){drawHow();}
  if(id==='nmS'){drawNmDuck();nmCheck();}
  if(id!=='gS'&&id!=='eS'&&id!=='nmCfS'){if(animID){cancelAnimationFrame(animID);animID=null;}drawBg();}
}
function showM(){showScr('mS');}
function showC(){showScr('cS');}
function showRank(){showScr('rkS');}
window.showM=showM; window.showC=showC; window.showScr=showScr; window.showRank=showRank;

function startG(mode){
  window.gMode=mode; gMode=mode;
  bul=[BM,BM,BM,BM]; scores=[0,0,0,0];
  totalBulUsed=[0,0,0,0]; bulAtStart=[BM,BM,BM,BM]; bulletEmptied=false;
  tgts=[]; tCnt=0; gAct=true; fever=false; batchN=0; reloading=false; reloadPct=0;
  nextWave=Date.now()+1200;
  showScr('gS');
  document.getElementById('fb').classList.remove('on');
  document.getElementById('rlBar').classList.remove('on');
  if(animID)cancelAnimationFrame(animID);
  loop();
}
window.startG=startG;

function loop(){
  ctx.clearRect(0,0,GW,GH);
  drawBg();
  updT();
  drawT();
  drawP();
  drawHUD();
  drawRlBar();
  if(gAct)animID=requestAnimationFrame(loop);
}

function drawBg(){
  const sky=ctx.createLinearGradient(0,0,0,GH*0.52);
  sky.addColorStop(0,'#0d0500');
  sky.addColorStop(0.4,'#6B2E00');
  sky.addColorStop(1,'#C87020');
  ctx.fillStyle=sky; ctx.fillRect(0,0,GW,GH*0.52);
  const gnd=ctx.createLinearGradient(0,GH*0.52,0,GH);
  gnd.addColorStop(0,'#B86A18');
  gnd.addColorStop(0.3,'#905010');
  gnd.addColorStop(1,'#3E1A06');
  ctx.fillStyle=gnd; ctx.fillRect(0,GH*0.52,GW,GH*0.48);
  ctx.strokeStyle='rgba(110,55,0,0.5)'; ctx.lineWidth=1.2;
  ctx.beginPath(); ctx.moveTo(0,GH*0.52); ctx.lineTo(GW,GH*0.52); ctx.stroke();
  for(let i=0;i<9;i++){
    const mx=GW*(i*0.12+0.04),my=GH*0.50,mw=GW*0.018,mh=GH*0.09+Math.sin(i*1.9)*GH*0.03;
    ctx.fillStyle=`rgba(0,0,0,${0.10+i%3*0.04})`;
    ctx.beginPath(); ctx.moveTo(mx,my); ctx.lineTo(mx-mw,my+mh); ctx.lineTo(mx+mw,my+mh); ctx.closePath(); ctx.fill();
  }
  const stars=[[70,14],[190,9],[310,20],[430,11],[570,18],[130,30],[380,7],[540,26]];
  ctx.fillStyle='rgba(255,220,120,0.6)';
  stars.forEach(([sx,sy])=>{ctx.beginPath();ctx.arc(sx,sy,1,0,Math.PI*2);ctx.fill();});
}

function updT(){
  if(!gAct)return;
  const now=Date.now();
  if(!fever&&tCnt>=80){startFever();return;}
  if(fever&&tCnt>=100){endG();return;}
  if(now>=nextWave&&tCnt<(fever?100:80)){
    if(!fever&&batchN>0&&batchN%8===0){
      doAIrl(); batchN=0; nextWave=now+2000; return;
    }
    spawnWave(); 
  }
  tgts.forEach(t=>{
    if(!t.alive)return;
    t.age+=16;
    if(t.moving){
      t.x+=t.vx; t.y+=t.vy;
      if(t.x<-80||t.x>GW+80||t.age>t.ls){t.alive=false;return;}
    } else {
      if(t.age>t.ls){t.alive=false;return;}
    }
    t.op=t.age<120?(t.age/120):t.age>t.ls-150?((t.ls-t.age)/150):1;
    t.op=Math.max(0,Math.min(1,t.op));
    if(!t.aiS&&t.age>200)tryAI(t);
  });
  tgts=tgts.filter(t=>t.alive||t.ha>0);
  tgts.forEach(t=>{if(t.ha>0)t.ha-=2;});

  if(reloading){
    const p=(now-reloadStart)/1000;
    reloadPct=Math.min(1,p);
    if(p>=1){
      reloading=false; reloadPct=0;
      bul[0]=BM;
      document.getElementById('rlBar').classList.remove('on');
    }
  }
}

function spawnWave(){
  const now=Date.now();
  const ls=fever?1600:(gMode==='hunter'?2600:1500);
  const count=fever?3:(gMode==='hunter'?Math.floor(Math.random()*2)+2:Math.floor(Math.random()*3)+2);
  for(let i=0;i<count&&tCnt<(fever?100:80);i++){
    let pool=fever?TTYPES.filter(x=>x.pts>=300):TTYPES;
    const tt=pool[Math.floor(Math.random()*pool.length)];
    const moving=!fever&&Math.random()<(gMode==='hunter'?0.22:0.45);
    let x,y,vx=0,vy=0;
    if(moving){
      const fromLeft=Math.random()<0.5;
      x=fromLeft?-40:GW+40;
      y=GH*0.10+Math.random()*GH*0.32;
      const spd=gMode==='hunter'?2.2+Math.random()*1.2:3.5+Math.random()*2.0;
      vx=(fromLeft?1:-1)*spd;
      vy=(Math.random()-0.5)*0.6;
    } else {
      x=GW*0.07+Math.random()*(GW*0.86);
      y=GH*0.09+Math.random()*GH*0.32;
    }
    tgts.push({x,y,sz:tt.sz,t:tt.t,c:tt.c,lc:tt.lc,pts:tt.pts,ic:tt.ic,
      age:0,ls,op:0,alive:true,ha:0,hb:-1,aiS:false,
      moving,vx,vy,
      sc:1});
    tCnt++;
  }
  batchN+=count;
  const gap=fever?400:(gMode==='hunter'?1800+Math.random()*600:800+Math.random()*300);
  nextWave=now+gap;
}

function tryAI(t){
  for(let i=1;i<4;i++){
    if(bul[i]<=0){if(Math.random()<(gMode==='hunter'?0.30:0.40))setTimeout(()=>{bul[i]=BM;},gMode==='hunter'?350:250);continue;}
    const remain=t.ls-t.age;
    if(remain<(gMode==='hunter'?1800:1000)&&Math.random()<(gMode==='hunter'?0.038:0.030)){
      const ci=i,ct=t;
      setTimeout(()=>{
        if(ct.alive&&bul[ci]>0){bul[ci]--;scores[ci]+=ct.pts;ct.alive=false;ct.ha=26;ct.hb=ci;}
      },gMode==='hunter'?Math.random()*100+40:Math.random()*100+30);
      break;
    }
  }
}

function doAIrl(){for(let i=1;i<4;i++)setTimeout(()=>{bul[i]=BM;},gMode==='hunter'?350:250);}

function drawRlBar(){
  if(!reloading)return;
  const c2=document.getElementById('rlC').getContext('2d');
  c2.clearRect(0,0,100,26);
  c2.fillStyle='rgba(0,0,0,0.6)';
  c2.beginPath(); c2.roundRect(0,0,100,26,5); c2.fill();
  c2.fillStyle='#555';
  c2.beginPath(); c2.roundRect(6,8,88,10,4); c2.fill();
  const pg=c2.createLinearGradient(6,0,94,0);
  pg.addColorStop(0,'#FF6600'); pg.addColorStop(1,'#FFD700');
  c2.fillStyle=pg;
  c2.beginPath(); c2.roundRect(6,8,88*reloadPct,10,4); c2.fill();
  c2.fillStyle='#FFD700'; c2.font='bold 10px Georgia'; c2.textAlign='center';
  c2.fillText('재장전 중...',50,22);
}

function startFever(){
  fever=true;
  const fb=document.getElementById('fb');
  fb.classList.add('on');
  setTimeout(()=>fb.classList.remove('on'),2600);
  nextWave=Date.now()+300;
}

function drawT(){
  tgts.forEach(t=>{
    if(t.ha>0){
      ctx.save(); ctx.globalAlpha=t.ha/26;
      ctx.fillStyle='#FFD700';
      ctx.font=`bold ${26*t.ha/26}px Georgia`;
      ctx.textAlign='center';
      ctx.fillText(`+${t.pts}`,t.x,t.y-t.sz*0.5-t.ha);
      ctx.restore(); return;
    }
    if(!t.alive)return;
    ctx.save(); ctx.globalAlpha=t.op;
    ctx.translate(t.x,t.y);
    drawTgt(ctx,t);
    ctx.restore();
  });
}

function drawTgt(c,t){
  const r=t.sz*0.5;
  c.fillStyle='rgba(0,0,0,0.18)';
  c.beginPath(); c.ellipse(0,r*0.88,r*0.82,r*0.16,0,0,Math.PI*2); c.fill();
  c.fillStyle=t.c; c.strokeStyle=t.lc; c.lineWidth=2.5;
  drawWob(c,0,0,r);
  c.fillStyle='rgba(255,255,255,0.16)'; c.strokeStyle='rgba(0,0,0,0.22)'; c.lineWidth=1.5;
  drawWob(c,0,0,r*0.6);
  c.strokeStyle='rgba(0,0,0,0.28)'; c.lineWidth=1.2;
  c.beginPath(); c.moveTo(-r*0.42,0); c.lineTo(r*0.42,0); c.stroke();
  c.beginPath(); c.moveTo(0,-r*0.42); c.lineTo(0,r*0.42); c.stroke();
  c.fillStyle='rgba(255,255,255,0.6)';
  c.beginPath(); c.arc(0,0,r*0.09,0,Math.PI*2); c.fill();
  c.font=`${r*0.85}px serif`; c.textAlign='center'; c.textBaseline='middle';
  c.fillText(t.ic,0,r*0.06);
  c.strokeStyle=t.lc; c.lineWidth=3;
  c.beginPath(); c.moveTo(0,r); c.lineTo(0,r*1.5); c.stroke();
  if(t.moving){
    c.fillStyle='rgba(255,255,255,0.45)';
    c.font='bold 9px Georgia'; c.textBaseline='alphabetic';
    c.fillText('→',t.vx>0?r*0.4:-r*0.4,-r*0.7);
  }
}

function drawWob(c,x,y,r){
  c.beginPath();
  const n=13;
  for(let i=0;i<=n;i++){
    const a=(i/n)*Math.PI*2;
    const w=1+(Math.sin(i*2.1)*0.036+Math.cos(i*1.6)*0.022);
    const rx=x+Math.cos(a)*r*w, ry=y+Math.sin(a)*r*w;
    i===0?c.moveTo(rx,ry):c.lineTo(rx,ry);
  }
  c.closePath(); c.fill(); c.stroke();
}

function drawStar5(c,cx,cy,r1,r2){
  c.beginPath();
  for(let i=0;i<10;i++){
    const a=i*Math.PI/5-Math.PI/2, r=i%2===0?r1:r2;
    i===0?c.moveTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r):c.lineTo(cx+Math.cos(a)*r,cy+Math.sin(a)*r);
  }
  c.closePath(); c.fill();
}

function handleClick(e){
  if(!gAct)return;
  const rect=gc.getBoundingClientRect();
  const scX=GW/rect.width, scY=GH/rect.height;
  const cx=((e.clientX||(e.touches&&e.touches[0].clientX)||0)-rect.left)*scX;
  const cy=((e.clientY||(e.touches&&e.touches[0].clientY)||0)-rect.top)*scY;

  if(reloading)return;

  const sp=GW/5;
  const px=sp, py=GH-58;
  if(Math.abs(cx-px)<28&&Math.abs(cy-py)<30){
    if(bul[0]<BM){
      reloading=true; reloadStart=Date.now(); reloadPct=0;
      document.getElementById('rlBar').classList.add('on');
    }
    return;
  }

  if(bul[0]<=0)return;
  bul[0]--; totalBulUsed[0]++;
  if(bul[0]===0)bulletEmptied=true;

  for(let i=tgts.length-1;i>=0;i--){
    const t=tgts[i];
    if(!t.alive)continue;
    const dx=cx-t.x, dy=cy-t.y;
    const r=t.sz*0.54;
    if(dx*dx+dy*dy<r*r){
      scores[0]+=t.pts; t.alive=false; t.ha=26; t.hb=0; break;
    }
  }
}

gc.addEventListener('click',handleClick);
gc.addEventListener('touchstart',e=>{if(gAct){e.preventDefault();handleClick(e);}},{passive:false});

function drawChal(){
  const W=520,H=330;
  const c=document.getElementById('chalC').getContext('2d');
  c.fillStyle='#1a0d05'; c.fillRect(0,0,W,H);

  const groups=[
    {reward:'🔫 황금 리볼버', unlocked:gRev, keys:['hunter_win','hunter_5k','hunter_8k']},
    {reward:'🦆 황금 오리',   unlocked:gDuck, keys:['sheriff_win','sheriff_8k']},
    {reward:'🤠 황금 모자',   unlocked:gHat,  keys:['hunter_noempty','sheriff_noempty']},
  ];

  const colW=160, itemH=26, groupPad=14, rewardH=30;
  const startX=10;
  let gx=startX;

  groups.forEach((grp,gi)=>{
    const totalH=rewardH+grp.keys.length*itemH+groupPad;
    const gy=H/2-totalH/2;

    // Group background
    const allDone=grp.unlocked;
    c.fillStyle=allDone?'rgba(255,215,0,0.08)':'rgba(255,255,255,0.03)';
    c.beginPath(); c.roundRect(gx,gy,colW,totalH,8); c.fill();
    c.strokeStyle=allDone?'rgba(255,215,0,0.5)':'rgba(150,100,30,0.35)';
    c.lineWidth=1.2;
    c.beginPath(); c.roundRect(gx,gy,colW,totalH,8); c.stroke();

    // Reward header
    c.fillStyle=allDone?'rgba(255,215,0,0.18)':'rgba(80,50,10,0.5)';
    c.beginPath(); c.roundRect(gx,gy,colW,rewardH,{upperLeft:8,upperRight:8,lowerLeft:0,lowerRight:0}); c.fill();
    c.fillStyle=allDone?'#FFD700':'#999';
    c.font='bold 13px Georgia'; c.textAlign='center';
    c.fillText(grp.reward+(allDone?' ✨':''),gx+colW/2,gy+rewardH*0.68);

    // Divider
    c.strokeStyle=allDone?'rgba(255,215,0,0.3)':'rgba(150,100,30,0.3)';
    c.lineWidth=1;
    c.beginPath(); c.moveTo(gx+8,gy+rewardH); c.lineTo(gx+colW-8,gy+rewardH); c.stroke();

    // Challenge items
    grp.keys.forEach((k,ki)=>{
      const iy=gy+rewardH+ki*itemH;
      const done=cd[k];
      if(done){
        c.fillStyle='rgba(255,215,0,0.07)';
        c.fillRect(gx+1,iy,colW-2,itemH);
      }
      // check icon
      c.fillStyle=done?'#4CDD70':'#555';
      c.font='11px Georgia'; c.textAlign='left';
      c.fillText(done?'✓':'○',gx+9,iy+itemH*0.66);
      // label
      c.fillStyle=done?'#FFD700':'#AAA';
      c.font=(done?'bold ':'')+'11px Georgia';
      // Shorten label for width
      const label=CHAL_DEF[k].l;
      c.fillText(label,gx+24,iy+itemH*0.66);
    });

    gx+=colW+10;
  });
}

let rkMode='hunter';
function showRankTab(m){
  rkMode=m;
  document.getElementById('rkTabH').classList.toggle('gbtn',m==='hunter');
  document.getElementById('rkTabS').classList.toggle('gbtn',m==='sheriff');
  drawRankScreen();
}
window.showRankTab=showRankTab;
function drawRankScreen(){
  // set active tab style on open
  document.getElementById('rkTabH').classList.toggle('gbtn',rkMode==='hunter');
  document.getElementById('rkTabS').classList.toggle('gbtn',rkMode==='sheriff');
  const c=document.getElementById('rkC').getContext('2d');
  const W=500,H=230;
  c.fillStyle='#1a0d05'; c.fillRect(0,0,W,H);
  const DEV_SCORE=rkMode==='hunter'?15400:9600;
  let scores2=[];
  try{scores2=JSON.parse(localStorage.getItem(rkMode==='hunter'?'wdhb':'wdsb')||'[]');}catch(e){}

  // header row
  c.fillStyle='rgba(180,50,0,0.4)';
  c.beginPath(); c.roundRect(10,8,W-20,36,6); c.fill();
  c.strokeStyle='#FF6600'; c.lineWidth=1.5;
  c.beginPath(); c.roundRect(10,8,W-20,36,6); c.stroke();
  c.fillStyle='#FF4400'; c.font='bold 14px Georgia'; c.textAlign='left';
  c.fillText('👑',18,32);
  c.fillStyle='#FFD700'; c.font='bold 13px Georgia';
  c.fillText('개발자를 이겨라!',44,32);
  c.fillStyle='#FF6600'; c.textAlign='right'; c.font='bold 15px Georgia';
  c.fillText(DEV_SCORE.toLocaleString()+'점',W-16,32);

  if(scores2.length===0){
    c.fillStyle='#888'; c.font='13px Georgia'; c.textAlign='center';
    c.fillText('아직 기록이 없습니다. 도전해보세요!',W/2,140);
    return;
  }

  const medals=['🥇','🥈','🥉'];
  scores2.forEach((s,i)=>{
    const y=60+i*18;
    if(y>H-10) return;
    const beatDev=s>DEV_SCORE;
    c.fillStyle=beatDev?'rgba(255,215,0,0.10)':i===0?'rgba(255,255,255,0.06)':'rgba(255,255,255,0.03)';
    c.fillRect(10,y-13,W-20,17);
    c.fillStyle=beatDev?'#FFD700':i<3?['#FFD700','#C0C0C0','#CD7F32'][i]:'#888';
    c.font='bold 12px Georgia'; c.textAlign='left';
    c.fillText(i<3?medals[i]:`${i+1}.`,16,y);
    c.fillStyle=beatDev?'#FFD700':'#DDD';
    c.font=(beatDev?'bold ':'')+'12px Georgia';
    c.fillText('나',48,y);
    if(beatDev){c.fillStyle='#FF4'; c.font='bold 10px Georgia'; c.fillText('👑개발자 격파!',80,y);}
    c.fillStyle=beatDev?'#FFD700':'#FFF';
    c.textAlign='right'; c.font='bold 13px Georgia';
    c.fillText(s.toLocaleString()+'점',W-16,y);
  });
}

// ── 뱃지 ──
function drawBadge(){
  const beaten=checkDevBeaten();
  const bc=document.getElementById('badgeC');
  bc.style.display=beaten?'block':'none';
  if(!beaten) return;
  const c=bc.getContext('2d');
  const W=130,H=130,cx=65,cy=65,R=58;
  c.clearRect(0,0,W,H);
  // outer glow
  const glow=c.createRadialGradient(cx,cy,R*0.5,cx,cy,R*1.1);
  glow.addColorStop(0,'rgba(255,215,0,0.0)');
  glow.addColorStop(1,'rgba(255,215,0,0.35)');
  c.fillStyle=glow; c.beginPath(); c.arc(cx,cy,R*1.1,0,Math.PI*2); c.fill();
  // badge body
  const bg=c.createRadialGradient(cx-10,cy-12,4,cx,cy,R);
  bg.addColorStop(0,'#FFF8DC'); bg.addColorStop(0.4,'#FFD700'); bg.addColorStop(0.8,'#B8860B'); bg.addColorStop(1,'#6B4400');
  c.fillStyle=bg; c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.fill();
  c.strokeStyle='#FFD700'; c.lineWidth=3;
  c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.stroke();
  // star points around edge
  for(let i=0;i<8;i++){
    const a=i/8*Math.PI*2-Math.PI/2;
    const sx=cx+Math.cos(a)*(R-4), sy=cy+Math.sin(a)*(R-4);
    c.fillStyle='#FFD700';
    c.beginPath(); c.arc(sx,sy,4,0,Math.PI*2); c.fill();
    c.fillStyle='#FFF8DC';
    c.beginPath(); c.arc(sx,sy,2,0,Math.PI*2); c.fill();
  }
  // inner circle
  c.fillStyle='rgba(0,0,0,0.15)';
  c.beginPath(); c.arc(cx,cy,R-14,0,Math.PI*2); c.fill();
  // duck emoji big
  c.font='40px serif'; c.textAlign='center'; c.textBaseline='middle';
  c.fillText('🦆',cx,cy-8);
  // text
  c.fillStyle='#1a0800'; c.font='bold 9px Georgia'; c.textBaseline='alphabetic';
  c.fillText('명예보안관',cx,cy+30);
  c.fillStyle='#FF4400'; c.font='bold 8px Georgia';
  c.fillText('개발자 격파!',cx,cy+41);
  // shine
  const shine=c.createRadialGradient(cx-18,cy-20,2,cx-14,cy-16,26);
  shine.addColorStop(0,'rgba(255,255,255,0.55)');
  shine.addColorStop(1,'rgba(255,255,255,0)');
  c.fillStyle=shine; c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.fill();
}
function checkDevBeaten(){
  let hb=[],sb=[];
  try{hb=JSON.parse(localStorage.getItem('wdhb')||'[]');}catch(e){}
  try{sb=JSON.parse(localStorage.getItem('wdsb')||'[]');}catch(e){}
  return (hb.length>0&&hb[0]>15400)||(sb.length>0&&sb[0]>9600);
}

function drawHow(){
  const pg=HW_PAGES[hwPage];
  // draw tutorial canvas
  const c=document.getElementById('hwC').getContext('2d');
  // reuse drawBg onto hwC
  const _ctx=ctx; // save ref
  // draw bg manually

  c.fillStyle=sky; c.fillRect(0,0,GW,GH*0.52);

    // show targets with arrows

                   {x:510,y:100,sz:44,ic:'🦅',pts:300,c:'#3A80EE',lc:'#1050b0'}];
    targets.forEach(t=>{
      c.save(); c.translate(t.x,t.y);
      c.fillStyle=t.c; c.strokeStyle=t.lc; c.lineWidth=2.5;
      c.beginPath(); c.arc(0,0,t.sz*0.5,0,Math.PI*2); c.fill(); c.stroke();
      c.font=`${t.sz*0.7}px serif`; c.textAlign='center'; c.textBaseline='middle';

      c.restore();
      // point label
      c.fillStyle='#FFD700'; c.font='bold 13px Georgia'; c.textAlign='center';
      c.fillText('+'+t.pts+'점',t.x,t.y+t.sz*0.5+16);
      // tap indicator
      c.strokeStyle='rgba(255,215,0,0.7)'; c.lineWidth=2;
      c.setLineDash([4,3]);
      c.beginPath(); c.arc(t.x,t.y,t.sz*0.5+8,0,Math.PI*2); c.stroke();
      c.setLineDash([]);
    });

    targets.forEach(t=>{
      c.fillStyle='rgba(255,80,0,0.9)'; c.font='bold 11px Georgia'; c.textAlign='center';
      c.fillText('TAP!',t.x,t.y-t.sz*0.5-10);
    });

      c.beginPath(); c.roundRect(bx-2.5,by-5.5,5.5,11,1.5); c.fill(); c.stroke();
    }
    // warning text
    c.fillStyle='#FF4400'; c.font='bold 13px Georgia'; c.textAlign='center';
    c.fillText('⚠ 총알 부족!',px,py+72);
    // duck body
    c.fillStyle='#F0F0F0'; c.strokeStyle='#b8b8b8'; c.lineWidth=2;
    c.beginPath(); c.arc(px,py,20,0,Math.PI*2); c.fill(); c.stroke();
    c.font='24px serif'; c.textAlign='center'; c.textBaseline='middle';
    c.fillText('🦆',px,py);
    // pulsing ring highlight
    c.strokeStyle='#FFD700'; c.lineWidth=3;
    c.setLineDash([5,4]);
    c.beginPath(); c.arc(px,py,32,0,Math.PI*2); c.stroke();
    c.setLineDash([]);
    // tap arrow pointing down to duck
    c.fillStyle='#FFD700'; c.font='bold 28px Georgia'; c.textBaseline='alphabetic';
    c.fillText('👆',px-10,py-36);
    c.fillStyle='#FFD700'; c.font='bold 12px Georgia'; c.textAlign='center';
    c.fillText('내 오리를 탭!',px,py-40);
  } else {
    // fever page - show FEVER TIME banner + timer-like display
    c.fillStyle='rgba(255,80,0,0.18)'; c.fillRect(0,0,GW,GH);
    c.fillStyle='#FFD700'; c.font='bold 36px Georgia'; c.textAlign='center'; c.textBaseline='middle';
    c.shadowColor='#FF6600'; c.shadowBlur=18;
    c.fillText('🔥 FEVER TIME! 🔥',GW/2,GH*0.35);
    c.shadowBlur=0;
    // show lots of targets flying
    [{x:120,y:100,ic:'🦆',sz:38},{x:280,y:80,ic:'🦅',sz:44},{x:440,y:110,ic:'🦆',sz:38},{x:580,y:90,ic:'🦊',sz:50}].forEach(t=>{
      c.font=`${t.sz}px serif`; c.textAlign='center'; c.textBaseline='middle';
      c.fillText(t.ic,t.x,t.y);
    });
    c.fillStyle='rgba(255,215,0,0.85)'; c.font='bold 14px Georgia'; c.textBaseline='alphabetic';
    c.fillText('표적 20개가 한꺼번에 쏟아집니다!',GW/2,GH*0.62);
  }

  // overlay text
  document.getElementById('hwTxt').innerHTML=pg.txt.replace(/
/g,'<br>');

  // dots
  const dots=document.getElementById('hwDots');
  dots.innerHTML='';
  HW_PAGES.forEach((_,i)=>{
    const d=document.createElement('div');
    d.style.cssText=`width:8px;height:8px;border-radius:50%;background:${i===hwPage?'#FFD700':'#555'};`;
    dots.appendChild(d);
  });

  // button states
  document.getElementById('hwPrev').style.opacity=hwPage===0?'0.3':'1';
  document.getElementById('hwNext').style.display=hwPage===HW_PAGES.length-1?'none':'';
  document.getElementById('hwNext').textContent='다음 ▶';

  // last page: show confirm button
  if(hwPage===HW_PAGES.length-1){
    let cb=document.getElementById('hwConfirm');
    if(!cb){cb=document.createElement('button');cb.id='hwConfirm';cb.className='gbtn';cb.textContent='✅ 확인';cb.onclick=()=>showScr('sS');document.getElementById('hwOverlay').appendChild(cb);}
    document.getElementById('hwNext').style.display='none';
  } else {
    const cb=document.getElementById('hwConfirm');
    if(cb)cb.remove();
  }
}

function drawHero(){

  const x=60, y=108;

    const g=c.createRadialGradient(cx-rx*0.28,cy-ry*0.28,ry*0.07,cx,cy,ry*1.05);

  const hg=c.createLinearGradient(x-15,y-72,x+15,y-48);

  c.beginPath(); c.moveTo(x-11,y-18); c.lineTo(x+11,y-18); c.lineTo(x+13,y-10); c.lineTo(x,y-6); c.lineTo(x-13,y-10); c.closePath(); c.fill(); c.stroke();

function fitBox(){
  const box=document.getElementById('gBox');
  const vw=window.innerWidth, vh=window.innerHeight;
  const scaleX=vw/686, scaleY=vh/312;
  const scale=Math.min(scaleX,scaleY,1);
  box.style.transform=`scale(${scale})`;
}
fitBox();
window.addEventListener('resize',fitBox);
window.addEventListener('orientationchange',()=>setTimeout(fitBox,300));

// 가로 회전 시 전체화면
function tryFullscreen(){
  const el=document.documentElement;
  if(window.innerWidth>window.innerHeight){
    if(el.requestFullscreen)el.requestFullscreen();
    else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen();
    else if(el.mozRequestFullScreen)el.mozRequestFullScreen();
  }
}
window.addEventListener('orientationchange',()=>{setTimeout(tryFullscreen,300);});
screen.orientation&&screen.orientation.addEventListener('change',()=>{setTimeout(tryFullscreen,300);});
